# StockSpace local development stack.
#
# Phase 0–1 (current): `db` (PostgreSQL for Phase 2) and `web` (built frontend
# served by nginx). The API service is added in Phase 2.
#
# Usage:
#   docker compose up --build       # build and start everything
#   docker compose up db            # database only (for local API development)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockspace
      POSTGRES_PASSWORD: stockspace
      POSTGRES_DB: stockspace
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL
      # that typically occupies 5432. Inside the compose network it stays 5432.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockspace -d stockspace']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stockspace:stockspace@db:5432/stockspace
      PORT: '4000'
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      BETTER_AUTH_URL: http://localhost:4000
      # Set a real secret via the environment or an .env file next to compose.
      BETTER_AUTH_SECRET: \${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (see .env.example)}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, seed if empty, then start the server.
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
