name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint -w apps/web

      - name: Type check
        run: npm run typecheck -w apps/web

      - name: Test
        run: npm run test -w apps/web

      - name: Build
        run: npm run build -w apps/web

  api:
    name: api — lint, typecheck, test (PostgreSQL), build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockspace
          POSTGRES_PASSWORD: stockspace
          POSTGRES_DB: stockspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockspace -d stockspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI service containers are reachable on their mapped port; the test
      # database is created by the API test global setup.
      DATABASE_URL: postgresql://stockspace:stockspace@localhost:5432/stockspace
      DATABASE_URL_TEST: postgresql://stockspace:stockspace@localhost:5432/stockspace_test
      BETTER_AUTH_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/api

      - name: Type check
        run: npm run typecheck -w apps/api

      - name: Test (integration, real PostgreSQL)
        run: npm run test -w apps/api

      - name: Build
        run: npm run build -w apps/api

  e2e:
    name: e2e — Playwright smoke + axe (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockspace
          POSTGRES_PASSWORD: stockspace
          POSTGRES_DB: stockspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockspace -d stockspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_E2E: postgresql://stockspace:stockspace@localhost:5432/stockspace_e2e
      BETTER_AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke test (boots API + web, seeds stockspace_e2e)
        run: npm run test:e2e -w apps/web
